<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Budget Doux</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6F1;--ink:#5B4B57;--soft:#9A8A95;--rose:#F6CAD3;--lav:#DDD0F2;--mint:#CDEBDD;--peach:#FBDCC8;--line:#F2E6E8;--ac:#F6CAD3}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:600 15px Quicksand,system-ui,sans-serif}
#app{max-width:520px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 110px)}
h1,h2,h3{font-family:Fredoka,Quicksand,sans-serif;margin:0}h2{font-size:20px}h3{font-size:17px;margin-bottom:8px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:#fff;border-radius:26px;padding:16px;margin:12px 0;box-shadow:0 6px 18px #f0d9df66}
.btn,.ch{border:0;border-radius:999px;padding:10px 16px;font:inherit;font-weight:700;background:var(--rose);color:var(--ink);cursor:pointer}
.btn.l{background:var(--lav)}.btn.m{background:var(--mint)}.btn.p{background:var(--peach)}
.ch{background:var(--line);padding:8px 13px;margin:0 6px 6px 0}.ch.on{background:var(--lav)}
.big{font:600 34px Fredoka,sans-serif;margin:4px 0}.neg{color:#D9758D}.pos{color:#5FA987}small{display:block;color:var(--soft);font-weight:500;font-size:12px}
.bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--mint)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.g{flex:1}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--rose);background:#fff;color:#fff;font-weight:700;cursor:pointer}.ck.on{background:#F4A9BC;border-color:#F4A9BC}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.em{color:var(--soft);text-align:center;margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid>div{background:var(--bg);border-radius:18px;padding:10px}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--soft);font-weight:600;text-align:right;padding:6px 3px}td{padding:10px 3px;text-align:right;border-top:1px solid var(--line)}td:first-child,th:first-child{text-align:left}tr[data-a]{cursor:pointer}tfoot td{font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 8px);background:#fffc;backdrop-filter:blur(10px);max-width:520px;margin:auto}
nav button{flex:1;border:0;border-radius:20px;background:none;padding:6px 0;font:inherit;font-size:12px;color:var(--soft);cursor:pointer}nav button.on{background:var(--rose);color:var(--ink)}nav i{display:block;font-style:normal;font-size:20px}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:60px;height:60px;border-radius:50%;border:0;background:#F4A9BC;color:#fff;font-size:34px;box-shadow:0 8px 20px #f4a9bc88;cursor:pointer}
.nav2{display:flex;justify-content:space-between;align-items:center}.nav2 .btn{padding:8px 14px}
.wk{width:44px;height:36px;margin:0 4px 6px 0;border:0;border-radius:12px;background:var(--line);font:inherit;cursor:pointer}.wk.on{background:var(--mint)}
.ov{position:fixed;inset:0;background:#5b4b5755;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:#fff;border-radius:28px 28px 0 0;width:100%;max-width:520px;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:88vh;overflow:auto}
label,.f{display:block;margin:10px 0;color:var(--soft);font-size:13px}input,select,textarea{display:block;width:100%;margin-top4px;margin-top:4px;border:2px solid var(--line);border-radius:16px;padding:10px;font:inherit;color:var(--ink);background:#fff}input[type=color]{height:44px;padding:3px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:20}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
</style></head><body><div id="app"></div>
<script type="module">
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const n=v=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(v||0)).replace(/[\u202f\u00a0]/g,' ');
const X=v=>n(v)+' XPF',esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const today=new Date().toISOString().slice(0,10),CUR=today.slice(0,7);
const MN=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'],MS=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const TY={carte:['💳','Carte'],especes:['💶','Espèces'],retrait:['🏧','Retrait'],virement:['🔁','Virement'],revenu:['💰','Revenu']};
const sh=(ym,d)=>{let[y,m]=ym.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
const mk=(name,emoji)=>({id:uid(),name,emoji,color:'#F6CAD3',init:0,from:CUR,ovr:{},paid:{},up:Date.now(),accs:[{id:uid(),name:'Compte principal'}],
 cats:[['Logement','🏠'],['Abonnements','📱'],['Courses','🛒'],['Sorties','🍰'],['Transport','🚗'],['Beauté','💄']].map(([name,emoji])=>({id:uid(),name,emoji})),fixed:[],tx:[],envs:[]});
let S=JSON.parse(localStorage.getItem('bp')||'null')||{bs:[mk('Mon budget','🌸')],tab:'month',ym:CUR,yr:+CUR.slice(0,4),acc:''};
S.cur=S.cur||S.bs[0].id;
const B=()=>S.bs.find(b=>b.id==S.cur)||S.bs[0];
let fb=null,user=null,tm,un;
const em=()=>(user?.email||'').toLowerCase();
const can=(b=B())=>!b.cloud||b.mine||(user&&b.shared?.[em()]=='edit');
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2200)};
const catE=(b,id)=>b.cats.find(c=>c.id==id)?.emoji||'🏷️',catN=(b,id)=>b.cats.find(c=>c.id==id)?.name||'Sans catégorie';

/* calculs */
function avgVar(b){const ms=[...new Set(b.tx.map(t=>t.date.slice(0,7)))].filter(m=>m<=CUR);return ms.length?sum(ms,m=>st(b,m,1).vr)/ms.length:0}
function st(b,ym,raw){const T=b.tx.filter(t=>t.date.startsWith(ym)),s=k=>sum(T.filter(x=>x.type==k),x=>x.amt);
 const fi=sum(b.fixed.filter(f=>f.kind=='in'),f=>f.amt),fx=sum(b.fixed.filter(f=>f.kind!='in'),f=>f.amt);
 const card=s('carte'),esp=s('especes'),ret=s('retrait'),vir=s('virement'),inc=fi+s('revenu'),fut=!raw&&ym>CUR,vr=fut?avgVar(b):card+esp+vir;
 const out=fut?fx+vr:fx+card+ret+vir,start=b.ovr[ym]??(ym<=b.from?b.init:st(b,sh(ym,-1),raw).end);
 return{inc,fx,vr,card,esp,ret,vir,start,out,end:start+inc-out,rav:start+inc-fx-card-ret-vir,cash:ret-esp,fut,T}}

/* vues */
const yearV=b=>{const xs=[...Array(12)].map((_,i)=>{const ym=S.yr+'-'+String(i+1).padStart(2,'0');return[ym,i,st(b,ym)]});
 const tot=k=>sum(xs,x=>x[2][k]);
 return`<div class="nav2"><button class=btn data-a=yr data-v=-1>‹</button><h2>${S.yr}</h2><button class=btn data-a=yr data-v=1>›</button></div>
 <div class=card><table><tr><th>Mois</th><th>Revenus</th><th>Fixes</th><th>Variables</th><th>Solde fin</th></tr>
 ${xs.map(([ym,i,x])=>`<tr data-a=open data-v=${ym}><td>${MS[i]}<small>${x.fut?'prévu':'réel'}</small></td><td>${n(x.inc)}</td><td>${n(x.fx)}</td><td>${n(x.vr)}</td><td class="${x.end<0?'neg':''}">${n(x.end)}</td></tr>`).join('')}
 <tfoot><tr><td>Total</td><td>${n(tot('inc'))}</td><td>${n(tot('fx'))}</td><td>${n(tot('vr'))}</td><td></td></tr></tfoot></table>
 <small style="margin-top:8px">Les mois à venir utilisent tes charges fixes et la moyenne de tes dépenses variables passées. Touche un mois pour l'ouvrir. Montants en XPF.</small></div>`};

const monthV=b=>{const x=st(b,S.ym),[y,m]=S.ym.split('-'),av=x.start+x.inc,used=av>0?Math.min(100,Math.max(0,100*(av-x.rav)/av)):0;
 const fx=b.fixed.slice().sort((a,c)=>a.day-c.day).map(f=>{const p=b.paid[S.ym+f.id],i=f.kind=='in';return`<div class=li><button class="ck ${p?'on':''}" data-a=pay data-v=${f.id}>${p?'✓':''}</button><span class=g data-a=fx data-v=${f.id}>${i?'💰':catE(b,f.cat)} ${esc(f.name)}<small>le ${f.day}</small></span><b class="${i?'pos':''}">${i?'+':'−'}${n(f.amt)}</b></div>`}).join('')||'<p class=em>Ajoute tes charges fixes dans Réglages 🌷</p>';
 const T=x.T.filter(t=>!S.acc||t.acc==S.acc).sort((a,c)=>c.date.localeCompare(a.date)).map(t=>`<div class=li data-a=add data-v=${t.id}><span class=g>${TY[t.type][0]} ${esc(catN(b,t.cat))}<small>${t.date.slice(8)}/${m} ${esc(t.note)}</small></span><b class="${t.type=='revenu'?'pos':''}">${t.type=='revenu'?'+':'−'}${n(t.amt)}</b></div>`).join('')||'<p class=em>Aucune opération ce mois-ci 🎀</p>';
 return`<div class=nav2><button class=btn data-a=ym data-v=-1>‹</button><h2>${MN[+m-1]} ${y}</h2><button class=btn data-a=ym data-v=1>›</button></div>
 <div class=card><small>Reste à vivre</small><div class="big ${x.rav<0?'neg':''}">${X(x.rav)}</div><div class=bar><i style="width:${used}%"></i></div>
 <div class=grid style="margin-top:12px"><div data-a=start style="cursor:pointer"><small>Solde de départ ✏️</small>${X(x.start)}</div><div><small>Revenus</small>${X(x.inc)}</div><div><small>Charges prévues</small>${X(x.fx)}</div><div><small>Carte, retraits, virements</small>${X(x.card+x.ret+x.vir)}</div><div><small>Espèces en poche</small>${X(x.cash)}</div><div><small>Solde de fin</small>${X(x.end)}</div></div></div>
 <div class=card><h3>Charges prévues</h3>${fx}</div>
 <div class=card><h3>Mes opérations</h3><div style="margin-bottom:8px"><button class="ch ${S.acc?'':'on'}" data-a=flt data-v="">Tous les comptes</button>${b.accs.map(a=>`<button class="ch ${S.acc==a.id?'on':''}" data-a=flt data-v=${a.id}>${esc(a.name)}</button>`).join('')}</div>${T}</div>`};

const envV=b=>`<h2>Mes enveloppes 🐷</h2>`+(b.envs.map(e=>{const c=e.ch,sv=c?sum(c.done,w=>w*c.step):e.saved||0,g=c?c.step*1378:e.goal,p=g?Math.min(100,100*sv/g):0;
 return`<div class=card><div class=li style="border:0;padding-top:0"><span class=g>${esc(e.emoji)} ${esc(e.name)}<small>${X(sv)} sur ${X(g)}</small></span><button class="btn l" data-a=env data-v=${e.id}>✏️</button></div><div class=bar><i style="width:${p}%"></i></div>
 ${c?`<div style="margin-top:12px">${[...Array(52)].map((_,i)=>`<button class="wk ${c.done.includes(i+1)?'on':''}" data-a=wk data-v="${e.id}:${i+1}">${i+1}</button>`).join('')}<small>Semaine n = n × ${X(c.step)}</small></div>`:`<div class=row><button class="btn m" data-a=dep data-v="${e.id}:1">➕ Ajouter</button><button class="btn p" data-a=dep data-v="${e.id}:-1">➖ Retirer</button></div>`}</div>`}).join('')||'<p class=em>Crée ta première enveloppe ou un challenge 🌷</p>')+
 `<div class=row><button class=btn data-a=env data-v="">＋ Enveloppe</button><button class="btn l" data-a=chal>🎯 Challenge 52 semaines</button></div>`;

const list=(arr,a,lab)=>arr.map(o=>`<div class=li data-a=${a} data-v=${o.id}><span class=g>${lab(o)}</span><span>✏️</span></div>`).join('');
const setV=b=>`<h2>Réglages ⚙️</h2>
 <div class=card><h3>${esc(b.emoji)} ${esc(b.name)}</h3><div class=row style="margin-top:0"><button class=btn data-a=bud>✏️ Modifier ce budget</button><button class="btn l" data-a=nb>＋ Nouveau budget</button><button class="btn p" data-a=delb>🗑</button></div><small style="margin-top:8px">Solde initial ${X(b.init)} depuis ${b.from}</small></div>
 <div class=card><h3>Catégories</h3>${list(b.cats,'cat',c=>c.emoji+' '+esc(c.name))}<div class=row><button class="btn m" data-a=cat data-v="">＋ Catégorie</button></div></div>
 <div class=card><h3>Charges et revenus fixes</h3>${list(b.fixed,'fx',f=>(f.kind=='in'?'💰 ':catE(b,f.cat)+' ')+esc(f.name)+`<small>${X(f.amt)} · le ${f.day}</small>`)}<div class=row><button class="btn m" data-a=fx data-v="">＋ Charge ou revenu</button></div></div>
 <div class=card><h3>Comptes</h3>${list(b.accs,'acc',a=>'🏦 '+esc(a.name))}<div class=row><button class="btn m" data-a=acc data-v="">＋ Compte</button></div></div>
 <div class=card><h3>Partage et synchro ☁️</h3>${syncV(b)}</div>
 <div class=card><h3>Sauvegarde</h3><div class=row style="margin-top:0"><button class="btn l" data-a=exp>⬇️ Exporter</button><button class="btn l" data-a=imp>⬆️ Importer</button></div></div>`;
const syncV=b=>{if(!S.fb)return`<p class=em style="margin-top:0">Colle ta config Firebase pour partager.</p><button class=btn data-a=cfg>🔑 Config Firebase</button>`;
 if(!user)return`<button class=btn data-a=login>Se connecter</button> <button class="btn l" data-a=cfg>🔑 Config</button>`;
 const o=`<small>Connectée : ${esc(em())}</small><div class=row><button class="btn l" data-a=out>Se déconnecter</button></div>`;
 if(!b.cloud)return o+`<div class=row><button class="btn m" data-a=cloud>☁️ Synchroniser ce budget</button></div>`;
 return o+`<h3 style="margin-top:14px">Personnes invitées</h3>`+Object.entries(b.shared||{}).map(([e,r])=>`<div class=li><span class=g>${esc(e)}<small>${r=='edit'?'peut modifier':'lecture seule'}</small></span>${b.mine?`<button class="btn p" data-a=unsh data-v="${esc(e)}">✕</button>`:''}</div>`).join('')+(b.mine?`<div class=row><button class="btn m" data-a=share>✉️ Inviter</button></div>`:'')};

function render(){const b=B();document.documentElement.style.setProperty('--ac',b.color||'#F6CAD3');
 const nav=[['year','📅','Année'],['month','🌸','Mois'],['save','🐷','Épargne'],['set','⚙️','Réglages']].map(([k,e,l])=>`<button class="${S.tab==k?'on':''}" data-a=tab data-v=${k}><i>${e}</i>${l}</button>`).join('');
 $('#app').innerHTML=`<header><button class=btn style="background:${b.color||'#F6CAD3'}" data-a=pick>${esc(b.emoji)} ${esc(b.name)} ▾</button><small>${user?'☁️':''}${can(b)?'':' 👀 lecture seule'}</small></header>${{year:yearV,month:monthV,save:envV,set:setV}[S.tab](b)}<nav>${nav}</nav>${S.tab=='month'&&can(b)?'<button class=fab data-a=add data-v="" aria-label="Ajouter">＋</button>':''}`}

/* formulaire */
function ask(title,fs,vals,ok,del,dl){const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class=sh><h2>${title}</h2>${fs.map(f=>f.t=='chips'?`<div class=f>${f.l}<div style="margin-top:6px"><input type=hidden name=${f.k} value="${esc(vals[f.k])}">${f.o.map(([v,l])=>`<button type=button class="ch ${v==vals[f.k]?'on':''}" data-chip="${v}">${l}</button>`).join('')}</div></div>`:
 `<label>${f.l}${f.t=='sel'?`<select name=${f.k}>${f.o.map(([v,l])=>`<option value="${v}" ${vals[f.k]==v?'selected':''}>${esc(l)}</option>`).join('')}</select>`:f.t=='area'?`<textarea rows=7 name=${f.k}>${esc(vals[f.k])}</textarea>`:`<input name=${f.k} type=${f.t||'text'} value="${esc(vals[f.k])}">`}</label>`).join('')}
 <div class=row><button class="btn m" data-ok>Enregistrer</button>${del?`<button class="btn p" data-del>${dl||'Supprimer'}</button>`:''}<button class="btn l" data-no>Annuler</button></div></div>`;
 document.body.append(o);
 const get=()=>{const r={};o.querySelectorAll('[name]').forEach(i=>r[i.name]=i.type=='number'?+i.value:i.value);return r};
 o.onclick=e=>{const d=e.target.dataset,c=e.target.closest('[data-chip]');
  if(c){c.parentNode.querySelectorAll('.ch').forEach(x=>x.classList.remove('on'));c.classList.add('on');c.parentNode.querySelector('input').value=c.dataset.chip}
  if(d.no!==undefined||e.target==o)o.remove();
  if(d.ok!==undefined){const r=get();o.remove();ok(r)}
  if(d.del!==undefined&&(dl||confirm('Supprimer ?'))){const r=get();o.remove();del(r)}};
 o.addEventListener('click',e=>e.stopPropagation())}

function save(){localStorage.setItem('bp',JSON.stringify(S));clearTimeout(tm);tm=setTimeout(push,900)}
function touch(){B().up=Date.now();save();render()}
const crud=(k,ti,fs,df)=>id=>{const b=B(),o=id?b[k].find(x=>x.id==id):df(b);ask(ti,fs(b),o,r=>{Object.assign(o,r);if(!id){o.id=uid();b[k].push(o)}touch()},id&&(()=>{b[k]=b[k].filter(x=>x.id!=id);touch()}))};
const catOpts=b=>b.cats.map(c=>[c.id,c.emoji+' '+c.name]);
const A={
 tab:v=>{S.tab=v;save();render();scrollTo(0,0)},ym:v=>{S.ym=sh(S.ym,+v);save();render()},yr:v=>{S.yr+=+v;save();render()},
 open:v=>{S.ym=v;S.tab='month';save();render()},flt:v=>{S.acc=v;save();render()},
 pay:v=>{const b=B(),k=S.ym+v;b.paid[k]=!b.paid[k];touch()},
 start:()=>{const b=B(),x=st(b,S.ym);ask('Solde de départ',[{k:'v',l:'Montant (XPF)',t:'number'}],{v:x.start},r=>{b.ovr[S.ym]=r.v;touch()},b.ovr[S.ym]!==undefined&&(()=>{delete b.ovr[S.ym];touch()}),'Report automatique')},
 add:id=>{const b=B(),t=id?b.tx.find(x=>x.id==id):{type:'carte',amt:0,date:S.ym==CUR?today:S.ym+'-01',acc:S.acc||b.accs[0]?.id,cat:b.cats[0]?.id,note:''};
  ask(id?'Modifier':'Nouvelle opération',[{k:'type',l:'Type',t:'chips',o:Object.entries(TY).map(([k,v])=>[k,v[0]+' '+v[1]])},{k:'amt',l:'Montant (XPF)',t:'number'},{k:'cat',l:'Catégorie',t:'sel',o:catOpts(b)},{k:'acc',l:'Compte',t:'sel',o:b.accs.map(a=>[a.id,a.name])},{k:'date',l:'Date',t:'date'},{k:'note',l:'Note'}],t,r=>{Object.assign(t,r);if(!id){t.id=uid();b.tx.push(t)}S.ym=t.date.slice(0,7);touch()},id&&(()=>{b.tx=b.tx.filter(x=>x.id!=id);touch()}))},
 cat:crud('cats','Catégorie',()=>[{k:'emoji',l:'Emoji'},{k:'name',l:'Nom'}],()=>({emoji:'🌷',name:''})),
 acc:crud('accs','Compte',()=>[{k:'name',l:'Nom du compte'}],()=>({name:''})),
 fx:crud('fixed','Charge ou revenu fixe',b=>[{k:'kind',l:'Type',t:'chips',o:[['out','💸 Charge'],['in','💰 Revenu']]},{k:'name',l:'Nom'},{k:'amt',l:'Montant mensuel (XPF)',t:'number'},{k:'cat',l:'Catégorie',t:'sel',o:catOpts(b)},{k:'day',l:'Jour du mois',t:'number'}],b=>({kind:'out',name:'',amt:0,cat:b.cats[0]?.id,day:1})),
 env:crud('envs','Enveloppe',()=>[{k:'emoji',l:'Emoji'},{k:'name',l:'Nom'},{k:'goal',l:'Objectif (XPF)',t:'number'}],()=>({emoji:'🐷',name:'',goal:0,saved:0})),
 chal:()=>ask('Challenge 52 semaines',[{k:'name',l:'Nom'},{k:'step',l:'Montant de base par semaine (XPF)',t:'number'}],{name:'Mon challenge',step:100},r=>{B().envs.push({id:uid(),emoji:'🎯',name:r.name,goal:0,ch:{step:r.step||100,done:[]}});touch()}),
 wk:v=>{const[i,w]=v.split(':'),c=B().envs.find(e=>e.id==i).ch,k=+w;c.done=c.done.includes(k)?c.done.filter(x=>x!=k):[...c.done,k];touch()},
 dep:v=>{const[i,s]=v.split(':'),e=B().envs.find(e=>e.id==i);ask(s>0?'Ajouter':'Retirer',[{k:'a',l:'Montant (XPF)',t:'number'}],{a:0},r=>{e.saved=Math.max(0,(e.saved||0)+s*r.a);touch()})},

/* firebase */
async function push(){if(!fb||!user)return;for(const b of S.bs)if(b.cloud&&can(b)&&b.up>(b.pushed||0)){const s=b.shared||{};
 try{await fb.F.setDoc(fb.F.doc(fb.db,'budgets',b.id),{owner:b.owner,emails:[b.oe,...Object.keys(s)],editors:[b.oe,...Object.keys(s).filter(k=>s[k]=='edit')],up:b.up,data:JSON.stringify({...b,pushed:0,mine:false})});b.pushed=b.up;localStorage.setItem('bp',JSON.stringify(S))}catch(e){toast('Synchro impossible 😢')}}}
function listen(){un&&un();un=null;if(!fb||!user)return;
 un=fb.F.onSnapshot(fb.F.query(fb.F.collection(fb.db,'budgets'),fb.F.where('emails','array-contains',em())),s=>{
  s.docChanges().forEach(c=>{if(c.type=='removed')return;const d=c.doc.data(),r=JSON.parse(d.data),l=S.bs.find(b=>b.id==r.id);
   if(!l)S.bs.push({...r,cloud:true,pushed:r.up,mine:d.owner==user.uid});else if(r.up>l.up)Object.assign(l,r,{cloud:true,pushed:r.up,mine:l.mine})});
  localStorage.setItem('bp',JSON.stringify(S));render();push()})}

 const app=a.initializeApp(S.fb);fb={au:au.getAuth(app),db:fs.getFirestore(app),A:au,F:fs};au.onAuthStateChanged(fb.au,u=>{user=u;listen();render()})}catch(e){toast('Firebase indisponible')}}
