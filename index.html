<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Budget Doux</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF6F1;--ink:#5B4B57;--soft:#8F7F8A;--rose:#F6CAD3;--lav:#DDD0F2;--mint:#CDEBDD;--peach:#FBDCC8;--line:#F2E6E8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:600 16px Quicksand,system-ui,sans-serif}
#app{width:100%;padding:calc(env(safe-area-inset-top,0px) + 14px) clamp(12px,3vw,32px) calc(env(safe-area-inset-bottom,0px) + 110px)}
h2,h3{font-family:Fredoka,Quicksand,sans-serif;margin:0}h2{font-size:24px}
header,.nav2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.gr{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}.full{grid-column:1/-1}
.card{border-radius:28px;padding:18px;background:#fff}
.c1{background:#FCE4EA}.c2{background:#FFEBDD}.c3{background:#E1F4EA}.c4{background:#E3ECFA}.c5{background:#ECE6F8}.c6{background:#FFF4D6}.c7{background:#FADBD8}
.hd{display:flex;justify-content:space-between;align-items:center;font:600 21px Fredoka,sans-serif;margin-bottom:6px}.hd b{font-size:22px}
.btn,.ch{border:0;border-radius:999px;padding:11px 18px;font:inherit;font-weight:700;background:var(--rose);color:var(--ink);cursor:pointer}
.btn.l{background:var(--lav)}.btn.m{background:var(--mint)}.btn.p{background:var(--peach)}.btn.w{background:#fff}
.ch{background:var(--line);padding:8px 13px;margin:0 6px 6px 0;display:inline-block;font-size:14px}.ch.on{background:var(--lav)}
.big{font:600 clamp(34px,7vw,52px) Fredoka,sans-serif;margin:2px 0}.neg{color:#D9758D}.pos{color:#4E9B78}small{display:block;color:var(--soft);font-weight:500;font-size:13px}
.li{display:flex;align-items:center;gap:10px;padding:11px 12px;margin:7px 0;background:#ffffffb8;border-radius:18px}.g{flex:1;cursor:pointer}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid #F4A9BC;background:#fff;color:#fff;font-weight:700;cursor:pointer}.ck.on{background:#F4A9BC}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.em{color:var(--soft);text-align:center;margin:8px 0}
.bar{height:12px;border-radius:9px;background:#ffffffaa;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:#8FD0B0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px clamp(8px,2vw,24px) calc(env(safe-area-inset-bottom,0px) + 8px);background:#fffd;backdrop-filter:blur(10px)}
nav button{flex:1;border:0;border-radius:20px;background:none;padding:6px 0;font:inherit;font-size:12px;color:var(--soft);cursor:pointer}nav button.on{background:var(--rose);color:var(--ink)}nav i{display:block;font-style:normal;font-size:21px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:62px;height:62px;border-radius:50%;border:0;background:#F4A9BC;color:#fff;font-size:34px;box-shadow:0 8px 20px #f4a9bc88;cursor:pointer}
.ov{position:fixed;inset:0;background:#5b4b5755;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:#fff;border-radius:28px 28px 0 0;width:100%;max-width:560px;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);max-height:88vh;overflow:auto}
label,.f{display:block;margin:10px 0;color:var(--soft);font-size:13px}input,select,textarea{display:block;width:100%;margin-top:4px;border:2px solid var(--line);border-radius:16px;padding:10px;font:inherit;color:var(--ink);background:#fff}input[type=color]{height:44px;padding:3px}input[type=range]{padding:0;accent-color:#F4A9BC}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:20}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
</style></head><body><div id="app"></div>
<script type="module">
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const n=v=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(Math.round(v||0)).replace(/[\u202f\u00a0]/g,' '),X=v=>n(v)+' XPF',esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const today=new Date().toISOString().slice(0,10),CUR=today.slice(0,7),DIM=ym=>new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
const MN=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const sh=(ym,d)=>{let[y,m]=ym.split('-').map(Number);m+=d;if(m<1){m=12;y--}if(m>12){m=1;y++}return y+'-'+String(m).padStart(2,'0')};
const TY={carte:['💳','Carte'],especes:['💶','Espèces'],retrait:['🏧','Retrait'],virement:['🔁','Virement'],credit:['🪪','Carte de crédit'],in:['💰','Entrée'],pv:['🔓','Prise perso']};
const OUT=['carte','especes','virement','credit'];
const mk=(name,emoji)=>({v:2,id:uid(),name,emoji,color:'#F6CAD3',bal:0,od:0,ccut:25,up:Date.now(),aside:{},st:{},cpaid:{},
 cats:[['Essence','⛽','q'],['Déjeuner','🥪','q'],['Petit-déjeuner','🥐','q'],['Sorties','🍰','q'],['Courses','🛒','q'],['Facture imprévue','🧾','i'],['Autre imprévu','⚠️','i']].map(([name,emoji,g])=>({id:uid(),name,emoji,g})),chg:[],inc:[],tx:[],envs:[],scn:[]});
let S=JSON.parse(localStorage.getItem('bp2')||'null')||{bs:[mk('Mon budget','🌸')],tab:'month',ym:CUR,sim:{aside:0,daily:0,imp:0,goal:0,mois:6}};
if(!S.fb)try{S.fb=JSON.parse(localStorage.getItem('bp')||'{}').fb}catch{}
S.cur=S.cur||S.bs[0].id;
const B=()=>S.bs.find(b=>b.id==S.cur)||S.bs[0];
let fb=null,user=null,tm,un;
const em=()=>(user?.email||'').toLowerCase();
const can=(b=B())=>!b.cloud||b.mine||(user&&b.shared?.[em()]=='edit');
const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2400)};

/* calculs */
const dl=t=>t.type=='in'?+t.amt:['carte','retrait','virement'].includes(t.type)?-t.amt:0;
const dm=(b,t)=>+t.date.slice(8)<=(+b.ccut||25)?t.date.slice(0,7):sh(t.date.slice(0,7),1);
const isDue=(c,ym)=>{const s=+c.step||1;return s==1||(((+ym.slice(5)-(+c.m0||1))%s)+s)%s==0};
function M(b,ym){const L=[],I=[],pv=sh(ym,-1),ad=(c,rm,res)=>{const k=rm+c.id,s=b.st[k]||{};I.push({c,k,amt:s.a??+c.amt,paid:s.p!=null,res})};
 b.chg.forEach(c=>{if(isDue(c,ym)){const k=ym+c.id,s=b.st[k]||{};L.push({c,k,amt:s.a??+c.amt,paid:s.p!=null})}});
 b.inc.forEach(c=>{if(+c.shift){ad(c,ym,1);ad(c,pv,0)}else ad(c,ym,0)});
 const cr=b.tx.filter(t=>t.type=='credit'),cardTot=sum(cr.filter(t=>dm(b,t)==ym),t=>t.amt),cardDue=Math.max(0,cardTot-(b.cpaid[ym]||0)),carry=sum(cr.filter(t=>t.date.startsWith(ym)&&dm(b,t)!=ym),t=>t.amt);
 const P=b.tx.filter(t=>t.pro),pot=sum(P.filter(t=>t.type=='in'),t=>t.amt)-sum(P.filter(t=>OUT.includes(t.type)||t.type=='pv'),t=>t.amt);
 const T=b.tx.filter(t=>!t.pro&&t.date.startsWith(ym)),unpaid=sum(L.filter(l=>!l.paid),l=>l.amt),toRecv=sum(I.filter(i=>!i.res&&!i.paid),i=>i.amt),reserved=sum(I.filter(i=>i.res&&i.paid),i=>i.amt);
 const days=ym==CUR?DIM(ym)-(+today.slice(8))+1:DIM(ym),avail=b.bal+(+b.od||0)+toRecv-reserved-unpaid-cardDue-Math.max(0,pot)-(b.aside[ym]||0);
 return{L,I,cardTot,cardDue,carry,pot,T,unpaid,toRecv,reserved,days,avail,per:avail/Math.max(1,days)}}

/* vues */
const find=(b,k)=>{const id=k.slice(7),c=b.chg.find(x=>x.id==id);return c?{c,sg:-1}:{c:b.inc.find(x=>x.id==id),sg:1}};
const ln=(b,l)=>{const neg=!l.c.shift&&b.chg.includes(l.c),mod=b.st[l.k]?.a!==undefined;return`<div class=li><button class="ck ${l.paid?'on':''}" data-a=chk data-v="${l.k}" aria-label="Payé">${l.paid?'✓':''}</button><span class=g data-a=ln data-v="${l.k}">${esc(l.c.name)}<small>le ${l.c.day}${l.res?' · compté le mois suivant':''}${mod?' · montant modifié ✏️':''}</small></span><b class="${neg?'':'pos'}">${neg?'−':'+'}${n(l.amt)}</b></div>`};
const catOf=(b,id)=>b.cats.find(c=>c.id==id)||{emoji:'🏷️',name:'Autre'};
const txr=(b,t)=>{const c=catOf(b,t.cat),inn=t.type=='in',pr=t.pro;return`<div class=li data-a=add data-v=${t.id}><span class=g>${TY[t.type][0]} ${pr?TY[t.type][1]:c.emoji+' '+esc(c.name)}<small>${t.date.slice(8)}/${t.date.slice(5,7)} ${esc(t.note)}${t.type=='credit'?' · prélevé le 30/'+dm(b,t).slice(5):''}</small></span><b class="${inn?'pos':''}">${inn?'+':t.type=='pv'?'':'−'}${n(t.amt)}</b></div>`};
const blk=(c,ico,t,tot,inner,sub='')=>`<section class="card ${c}"><div class=hd><span>${ico} ${t}</span><b>${tot}</b></div>${sub?`<small>${sub}</small>`:''}${inner}</section>`;
const nav2=(k)=>`<div class=nav2><button class=btn data-a=ym data-v=-1>‹</button><h2>${MN[+S.ym.slice(5)-1]} ${S.ym.slice(0,4)}</h2><button class=btn data-a=ym data-v=1>›</button></div>`;

const monthV=b=>{const x=M(b,S.ym),m=S.ym.slice(5),mens=x.L.filter(l=>(+l.c.step||1)==1),tri=x.L.filter(l=>(+l.c.step||1)>1),rev=x.I.filter(i=>!i.res),res=x.I.filter(i=>i.res),ex=x.T.filter(t=>t.type=='in');
 const cl=(g)=>x.T.filter(t=>!['in','retrait'].includes(t.type)&&(g=='i')==(t.grp=='i')).sort((a,c)=>c.date.localeCompare(a.date)),tot=a=>sum(a,t=>t.amt);
 const chips=(g,a)=>b.cats.filter(c=>c.g==g).map(c=>[c,tot(a.filter(t=>t.cat==c.id))]).filter(([,v])=>v).map(([c,v])=>`<span class=ch>${c.emoji} ${esc(c.name)} ${n(v)}</span>`).join('');
 const q=cl('q'),im=cl('i'),cc=b.tx.filter(t=>t.type=='credit'&&dm(b,t)==S.ym).sort((a,c)=>c.date.localeCompare(a.date)),rt=x.T.filter(t=>t.type=='retrait');
 const list=a=>a.map(t=>txr(b,t)).join('')||'<p class=em>Rien pour le moment</p>';
 return nav2()+`<div class=gr>
 <section class="card c1 full"><small>Je peux encore dépenser</small><div class="big ${x.avail<0?'neg':''}">${X(x.avail)}</div><div>≈ <b>${X(x.per)}</b> par jour · ${x.days} jour${x.days>1?'s':''} restants</div>
 <div class=row><button class="btn w" data-a=bal>🏦 Solde réel ${X(b.bal)}</button><button class="btn w" data-a=bud>Découvert ${X(b.od)}</button><button class="btn w" data-a=aside>🐷 Mise de côté ${X(b.aside[S.ym]||0)}</button></div></section>
 ${blk('c2','💳','Carte de crédit',X(x.cardDue),`<div class=row style="margin:6px 0"><button class="btn ${x.cardDue>0?'':'m'}" data-a=cpay>${x.cardDue>0?'Marquer comme prélevé le 30':'✓ Prélevé · annuler'}</button></div>${list(cc)}`,`À prélever le 30/${m} (achats jusqu'au ${b.ccut||25}) · reporté sur le mois suivant : ${X(x.carry)}`)}
 ${blk('c3','📅','Charges mensuelles',X(sum(mens.filter(l=>!l.paid),l=>l.amt)),mens.map(l=>ln(b,l)).join('')||'<p class=em>Ajoute-les dans Réglages</p>','Reste à payer')}
 ${blk('c4','🗓','Charges trimestrielles',X(sum(tri.filter(l=>!l.paid),l=>l.amt)),tri.map(l=>ln(b,l)).join('')||'<p class=em>Aucune ce mois-ci</p>','Reste à payer')}
 ${blk('c6','💰','Revenus du mois',X(sum(rev,i=>i.amt)+tot(ex)),rev.map(i=>ln(b,i)).join('')+ex.map(t=>txr(b,t)).join('')||'<p class=em>Aucun revenu</p>')}
 ${blk('c5','🔒','Réservé',X(Math.max(0,x.pot)+sum(res,i=>i.amt)),res.map(i=>ln(b,i)).join('')+`<div class=li data-a=tab data-v=pat><span class=g>🛍 Caisse Patente<small>Voir l'onglet Patente</small></span><b>${X(x.pot)}</b></div>`,"N'entre pas dans « je peux dépenser »")}
 ${blk('c1','☕','Quotidien',X(tot(q)),`<div>${chips('q',q)}</div>${list(q)}`)}
 ${blk('c7','⚠️','Imprévus',X(tot(im)),`<div>${chips('i',im)}</div>${list(im)}`)}
 ${rt.length?blk('c4','🏧','Retraits',X(tot(rt)),list(rt)):''}</div>`};

const simR=b=>{const x=M(b,CUR),s=S.sim,base=x.avail+(b.aside[CUR]||0),lim=base-s.aside-s.imp,tt=s.daily*x.days,left=lim-tt,acc=b.bal+x.toRecv-x.unpaid-x.cardDue-tt-s.imp-s.aside,d=s.daily>0?Math.floor(lim/s.daily):1e9;
 let msg='Tu tiens jusqu’à la fin du mois ✅';if(d<x.days){const dt=new Date(Date.now()+Math.max(0,d)*864e5);msg=`Ta marge est épuisée vers le ${dt.getDate()}/${dt.getMonth()+1} ⚠️`}
 return{left,acc,per:lim/x.days,msg,od:acc<-(+b.od||0)}};
const simOut=(b,r,s)=>`<div class=li><span class=g>Reste en fin de mois<small>mise de côté ${X(s.aside)} · ${X(s.daily)}/jour · imprévus ${X(s.imp)}</small></span><b class="${r.left<0?'neg':'pos'}">${X(r.left)}</b></div><div class=li><span class=g>Solde du compte en fin de mois<small>${r.od?'⚠️ au-delà de ton découvert':'dans ton découvert autorisé ou positif'}</small></span><b class="${r.acc<0?'neg':''}">${X(r.acc)}</b></div><div class=li><span class=g>Tu pourrais dépenser au maximum</span><b>${X(r.per)}/jour</b></div><p class=em>${r.msg}</p>`;
const simV=b=>{const s=S.sim,x=M(b,CUR),mx=Math.max(100000,Math.round(x.avail/1000)*1000);
 const sl=(k,l,max)=>`<label>${l}<input type=range data-sim=${k} min=0 max=${max} step=500 value=${s[k]}></label>`;
 return`<h2>Simulateur 🎯</h2><div class=gr style="margin-top:12px"><section class="card c5"><div class=hd><span>🎚 Mes curseurs</span></div>${sl('aside','Mise de côté ce mois',mx)}${sl('daily','Dépense par jour',30000)}${sl('imp','Imprévus',mx)}
 <div class=row><button class="btn m" data-a=scn>💾 Garder ce scénario</button></div></section>
 <section class="card c6"><div class=hd><span>🌴 Objectif voyage</span></div><label>Montant à atteindre (XPF)<input type=number inputmode=numeric data-sim=goal value=${s.goal||''}></label><label>En combien de mois<input type=number inputmode=numeric data-sim=mois value=${s.mois||''}></label><div class=li><span class=g>À mettre de côté par mois</span><b id=trip>${X(s.goal/Math.max(1,s.mois))}</b></div><div class=row><button class="btn" data-a=useTrip>Utiliser dans mes curseurs</button></div></section>
 <section class="card c3 full"><div class=hd><span>📊 Résultat</span></div><div id=simres>${simOut(b,simR(b),s)}</div></section>
 ${b.scn.map(c=>`<section class="card c4"><div class=hd><span>${esc(c.name)}</span></div>${simOut(b,simR2(b,c),c)}<div class=row><button class="btn l" data-a=scnUse data-v=${c.id}>Charger</button><button class="btn p" data-a=scnDel data-v=${c.id}>Supprimer</button></div></section>`).join('')}</div>`};
const simR2=(b,c)=>{const o=S.sim;S.sim=c;const r=simR(b);S.sim=o;return r};

const envV=b=>`<h2>Mes enveloppes 🐷</h2><p class=em>Tu les remplis toi-même quand tu mets de l'argent de côté.</p><div class=gr>`+b.envs.map(e=>{const p=e.goal?Math.min(100,100*(e.saved||0)/e.goal):0;
 return`<section class="card c${1+b.envs.indexOf(e)%6}"><div class=li style="margin-top:0"><span class=g>${esc(e.emoji)} ${esc(e.name)}<small>${X(e.saved||0)} sur ${X(e.goal)}</small></span><button class="btn w" data-a=env data-v=${e.id}>✏️</button></div><div class=bar><i style="width:${p}%"></i></div><div class=row><button class="btn m" data-a=dep data-v="${e.id}:1">➕ Ajouter</button><button class="btn p" data-a=dep data-v="${e.id}:-1">➖ Retirer</button></div></section>`}).join('')+`</div><div class=row><button class=btn data-a=env data-v="">＋ Nouvelle enveloppe</button></div>`;

const patV=b=>{const P=b.tx.filter(t=>t.pro),mo=P.filter(t=>t.date.startsWith(S.ym)),yr=P.filter(t=>t.date.startsWith(S.ym.slice(0,4))),x=M(b,S.ym);
 const v=a=>sum(a.filter(t=>t.type=='in'),t=>t.amt),d=a=>sum(a.filter(t=>OUT.includes(t.type)),t=>t.amt),p=a=>sum(a.filter(t=>t.type=='pv'),t=>t.amt);
 const two=(a,f)=>`<div class=li><span class=g>Ce mois<small>Année ${S.ym.slice(0,4)} : ${X(f(yr))}</small></span><b>${X(f(a))}</b></div>`;
 return nav2()+`<div class=gr><section class="card c5 full"><small>🔒 Caisse Patente (à garder pour la boutique)</small><div class="big ${x.pot<0?'neg':''}">${X(x.pot)}</div>
 <div class=row><button class="btn m" data-a=padd data-v=in>＋ Vente reçue</button><button class="btn p" data-a=padd data-v=carte>＋ Dépense pro</button><button class="btn l" data-a=padd data-v=pv>🔓 Prendre pour le perso</button></div></section>
 ${blk('c3','🛍','Ventes reçues',X(v(mo)),two(mo,v))}${blk('c7','🧾','Dépenses pro',X(d(mo)),two(mo,d))}${blk('c6','📈','Résultat',X(v(mo)-d(mo)),two(mo,a=>v(a)-d(a)))}${blk('c4','🔓','Pris pour le perso',X(p(mo)),two(mo,p))}
 <section class="card c1 full"><div class=hd><span>Opérations du mois</span></div>${mo.sort((a,c)=>c.date.localeCompare(a.date)).map(t=>txr(b,t)).join('')||'<p class=em>Aucune opération</p>'}</section></div>`};

const list=(arr,a,lab)=>arr.map(o=>`<div class=li data-a=${a} data-v=${o.id}><span class=g>${lab(o)}</span><span>✏️</span></div>`).join('');
const setV=b=>`<h2>Réglages ⚙️</h2><div class=gr style="margin-top:12px">
 <section class="card c1"><h3>${esc(b.emoji)} ${esc(b.name)}</h3><div class=row><button class=btn data-a=bud>✏️ Modifier</button><button class="btn l" data-a=nb>＋ Nouveau budget</button><button class="btn p" data-a=delb>🗑</button></div><small style="margin-top:8px">Solde réel ${X(b.bal)} · découvert ${X(b.od)}</small></section>
 <section class="card c3"><h3>Charges (mensuelles et trimestrielles)</h3>${list(b.chg,'chg',c=>esc(c.name)+`<small>${X(c.amt)} · le ${c.day} · ${+c.step>1?'trimestrielle':'mensuelle'}</small>`)}<div class=row><button class="btn m" data-a=chg data-v="">＋ Charge</button></div></section>
 <section class="card c6"><h3>Revenus</h3>${list(b.inc,'inc',c=>esc(c.name)+`<small>${X(c.amt)} · le ${c.day} · compté ${+c.shift?'le mois suivant':'le même mois'}</small>`)}<div class=row><button class="btn m" data-a=inc data-v="">＋ Revenu</button></div></section>
 <section class="card c2"><h3>Catégories</h3>${list(b.cats,'cat',c=>c.emoji+' '+esc(c.name)+`<small>${c.g=='i'?'imprévu':'quotidien'}</small>`)}<div class=row><button class="btn m" data-a=cat data-v="">＋ Catégorie</button></div></section>
 <section class="card c4"><h3>Partage et synchro ☁️</h3>${syncV(b)}</section>
 <section class="card c5"><h3>Sauvegarde</h3><div class=row><button class="btn w" data-a=exp>⬇️ Exporter</button><button class="btn w" data-a=imp>⬆️ Importer</button></div></section></div>`;
const syncV=b=>{if(!S.fb)return`<button class=btn data-a=cfg>🔑 Config Firebase</button>`;
 if(!user)return`<button class=btn data-a=login>Se connecter</button> <button class="btn w" data-a=cfg>🔑 Config</button>`;
 const o=`<small>Connectée : ${esc(em())}</small><div class=row><button class="btn w" data-a=out>Se déconnecter</button></div>`;
 if(!b.cloud)return o+`<div class=row><button class="btn m" data-a=cloud>☁️ Synchroniser ce budget</button></div>`;
 return o+Object.entries(b.shared||{}).map(([e,r])=>`<div class=li><span class=g>${esc(e)}<small>${r=='edit'?'peut modifier':'lecture seule'}</small></span>${b.mine?`<button class="btn p" data-a=unsh data-v="${esc(e)}">✕</button>`:''}</div>`).join('')+(b.mine?`<div class=row><button class="btn m" data-a=share>✉️ Inviter</button></div>`:'')};

function render(){const b=B(),T=[['month','🌸','Mois'],['sim','🎯','Simuler'],['save','🐷','Épargne'],['pat','🛍','Patente'],['set','⚙️','Réglages']];
 $('#app').innerHTML=`<header><button class=btn style="background:${b.color||'#F6CAD3'}" data-a=pick>${esc(b.emoji)} ${esc(b.name)} ▾</button><small>${user?'☁️':''}${can(b)?'':' 👀 lecture seule'}</small></header>${{month:monthV,sim:simV,save:envV,pat:patV,set:setV}[S.tab](b)}<nav>${T.map(([k,e,l])=>`<button class="${S.tab==k?'on':''}" data-a=tab data-v=${k}><i>${e}</i>${l}</button>`).join('')}</nav>${S.tab=='month'&&can(b)?'<button class=fab data-a=add data-v="" aria-label="Ajouter">＋</button>':''}`}

/* formulaire */
function ask(title,fs,vals,ok,del,dl2){const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class=sh><h2>${title}</h2>${fs.map(f=>f.t=='chips'?`<div class=f>${f.l}<div style="margin-top:6px"><input type=hidden name=${f.k} value="${esc(vals[f.k])}">${f.o.map(([v,l])=>`<button type=button class="ch ${v==vals[f.k]?'on':''}" data-chip="${v}">${l}</button>`).join('')}</div></div>`:
 `<label>${f.l}${f.t=='sel'?`<select name=${f.k}>${f.o.map(([v,l])=>`<option value="${v}" ${vals[f.k]==v?'selected':''}>${esc(l)}</option>`).join('')}</select>`:f.t=='area'?`<textarea rows=7 name=${f.k}>${esc(vals[f.k])}</textarea>`:`<input name=${f.k} type=${f.t=='num'?'text':f.t||'text'} ${f.t=='number'?'inputmode=numeric':''} value="${esc(vals[f.k])}">`}</label>`).join('')}
 <div class=row><button class="btn m" data-ok>Enregistrer</button>${del?`<button class="btn p" data-del>${dl2||'Supprimer'}</button>`:''}<button class="btn l" data-no>Annuler</button></div></div>`;
 document.body.append(o);
 const get=()=>{const r={};o.querySelectorAll('[name]').forEach(i=>r[i.name]=i.type=='number'?+i.value:i.value);return r};
 o.onclick=e=>{const d=e.target.dataset,c=e.target.closest('[data-chip]');
  if(c){c.parentNode.querySelectorAll('.ch').forEach(x=>x.classList.remove('on'));c.classList.add('on');c.parentNode.querySelector('input').value=c.dataset.chip}
  if(d.no!==undefined||e.target==o)o.remove();
  if(d.ok!==undefined){const r=get();o.remove();ok(r)}
  if(d.del!==undefined&&(dl2||confirm('Supprimer ?'))){const r=get();o.remove();del(r)}};
 o.addEventListener('click',e=>e.stopPropagation())}

function save(){localStorage.setItem('bp2',JSON.stringify(S));clearTimeout(tm);tm=setTimeout(push,900)}
function touch(){B().up=Date.now();save();render()}
const crud=(k,ti,fs,df)=>id=>{const b=B(),o=id?b[k].find(x=>x.id==id):df(b);ask(ti,fs(b),o,r=>{Object.assign(o,r);if(!id){o.id=uid();b[k].push(o)}touch()},id&&(()=>{b[k]=b[k].filter(x=>x.id!=id);touch()}))};
const txm=(id,pre)=>{const b=B(),t=id?b.tx.find(x=>x.id==id):{type:'carte',amt:0,grp:'q',date:S.ym==CUR?today:S.ym+'-01',note:'',cat:b.cats[0]?.id,...pre},pro=t.pro,old=id?dl(t):0;
 const ty=pro?['in','carte','virement','credit','especes','pv']:['carte','especes','retrait','virement','credit','in'];
 ask(id?'Modifier':pro?'Opération patente':'Nouvelle opération',[{k:'type',l:'Type',t:'chips',o:ty.map(k=>[k,TY[k][0]+' '+TY[k][1]])},{k:'amt',l:'Montant (XPF)',t:'number'},!pro&&{k:'grp',l:'Rubrique',t:'chips',o:[['q','☕ Quotidien'],['i','⚠️ Imprévu']]},!pro&&{k:'cat',l:'Catégorie',t:'sel',o:b.cats.map(c=>[c.id,c.emoji+' '+c.name])},{k:'date',l:'Date',t:'date'},{k:'note',l:'Note'}].filter(Boolean),t,
  r=>{b.bal-=old;Object.assign(t,r);if(!id){t.id=uid();b.tx.push(t)}b.bal+=dl(t);S.ym=t.date.slice(0,7);touch()},id&&(()=>{b.bal-=old;b.tx=b.tx.filter(x=>x.id!=id);touch()}))};
const A={
 tab:v=>{S.tab=v;save();render();scrollTo(0,0)},ym:v=>{S.ym=sh(S.ym,+v);save();render()},
 add:id=>txm(id),padd:v=>txm('',{pro:true,type:v}),
 bal:()=>{const b=B();ask('Solde réel en banque',[{k:'v',l:'Montant affiché par ta banque (XPF, négatif possible)',t:'num'}],{v:b.bal},r=>{const v=+String(r.v).replace(/\s/g,'').replace(',','.');if(isNaN(v))return toast('Montant invalide');b.bal=v;touch()})},
 aside:()=>{const b=B();ask('Mise de côté ce mois',[{k:'v',l:'Montant (XPF)',t:'number'}],{v:b.aside[S.ym]||0},r=>{b.aside[S.ym]=r.v;touch()})},
 cpay:()=>{const b=B(),x=M(b,S.ym),p=b.cpaid[S.ym]||0;if(x.cardDue>0){b.cpaid[S.ym]=p+x.cardDue;b.bal-=x.cardDue}else if(p>0){b.bal+=p;b.cpaid[S.ym]=0}touch()},
 chk:k=>{const b=B(),f=find(b,k),s=b.st[k]=b.st[k]||{},a=s.a??+f.c.amt;if(s.p==null){s.p=a;b.bal+=f.sg*a}else{b.bal-=f.sg*s.p;s.p=null}touch()},
 ln:k=>{const b=B(),f=find(b,k),s=b.st[k]=b.st[k]||{},a=s.a??+f.c.amt;ask(f.c.name,[{k:'a',l:'Montant réel ce mois (XPF)',t:'number'}],{a},r=>{if(s.p!=null){b.bal+=f.sg*(r.a-s.p);s.p=r.a}s.a=r.a;touch()},s.a!==undefined&&(()=>{delete s.a;if(s.p!=null){b.bal+=f.sg*(+f.c.amt-s.p);s.p=+f.c.amt}touch()}),'Revenir au prévu')},
 chg:crud('chg','Charge',()=>[{k:'name',l:'Nom'},{k:'amt',l:'Montant prévu (XPF)',t:'number'},{k:'day',l:'Jour du mois',t:'number'},{k:'step',l:'Fréquence',t:'chips',o:[['1','📅 Mensuelle'],['3','🗓 Trimestrielle']]},{k:'m0',l:'Si trimestrielle : mois du premier paiement (1 à 12)',t:'number'}],()=>({name:'',amt:0,day:1,step:'1',m0:1})),
 inc:crud('inc','Revenu',()=>[{k:'name',l:'Nom'},{k:'amt',l:'Montant prévu (XPF)',t:'number'},{k:'day',l:'Jour de réception',t:'number'},{k:'shift',l:'Compté pour',t:'chips',o:[['0','Le même mois'],['1','Le mois suivant']]}],()=>({name:'',amt:0,day:1,shift:'0'})),
 cat:crud('cats','Catégorie',()=>[{k:'emoji',l:'Emoji'},{k:'name',l:'Nom'},{k:'g',l:'Rubrique',t:'chips',o:[['q','☕ Quotidien'],['i','⚠️ Imprévu']]}],()=>({emoji:'🌷',name:'',g:'q'})),
 env:crud('envs','Enveloppe',()=>[{k:'emoji',l:'Emoji'},{k:'name',l:'Nom'},{k:'goal',l:'Objectif (XPF)',t:'number'}],()=>({emoji:'🐷',name:'',goal:0,saved:0})),
 dep:v=>{const[i,s]=v.split(':'),e=B().envs.find(e=>e.id==i);ask(s>0?'Ajouter':'Retirer',[{k:'a',l:'Montant (XPF)',t:'number'}],{a:0},r=>{e.saved=Math.max(0,(e.saved||0)+s*r.a);touch()})},
 scn:()=>ask('Nom du scénario',[{k:'name',l:'Nom'}],{name:'Scénario '+(B().scn.length+1)},r=>{B().scn.push({id:uid(),name:r.name,aside:S.sim.aside,daily:S.sim.daily,imp:S.sim.imp});touch()}),
 scnUse:v=>{const c=B().scn.find(x=>x.id==v);Object.assign(S.sim,{aside:c.aside,daily:c.daily,imp:c.imp});save();render()},
 scnDel:v=>{const b=B();b.scn=b.scn.filter(x=>x.id!=v);touch()},
 useTrip:()=>{S.sim.aside=Math.round(S.sim.goal/Math.max(1,S.sim.mois));save();render()},
 bud:()=>{const b=B();ask('Mon budget',[{k:'emoji',l:'Emoji'},{k:'name',l:'Nom'},{k:'color',l:'Couleur',t:'color'},{k:'od',l:'Découvert autorisé (XPF)',t:'number'},{k:'ccut',l:'Carte de crédit : dernier jour de la période (prélevé le 30)',t:'number'}],b,r=>{Object.assign(b,r);touch()})},
 nb:()=>ask('Nouveau budget',[{k:'emoji',l:'Emoji'},{k:'name',l:'Nom (ex : Parents, Business)'}],{emoji:'🌼',name:''},r=>{const b=mk(r.name||'Budget',r.emoji);S.bs.push(b);S.cur=b.id;S.tab='set';touch()}),
 delb:()=>{if(S.bs.length<2)return toast('Il faut garder au moins un budget');if(confirm('Supprimer ce budget et tout son contenu ?')){S.bs=S.bs.filter(b=>b.id!=S.cur);S.cur=S.bs[0].id;save();render()}},
 pick:()=>ask('Mes budgets',[{k:'id',l:'Choisir',t:'chips',o:S.bs.map(b=>[b.id,b.emoji+' '+b.name])}],{id:S.cur},r=>{S.cur=r.id;save();render()},()=>A.nb(),'＋ Nouveau budget'),
 exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='budget-doux.json';a.click()},
 imp:()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{try{S=JSON.parse(await i.files[0].text());save();render();toast('Importé 🌸')}catch{toast('Fichier invalide')}};i.click()},
 cfg:()=>ask('Config Firebase',[{k:'c',l:'Colle le bloc firebaseConfig',t:'area'}],{c:''},r=>{try{S.fb=Function('return ('+r.c.replace(/^[^{]*/,'').replace(/[^}]*$/,'')+')')();save();location.reload()}catch{toast('Config illisible')}}),
 login:()=>{if(!fb)return toast('Firebase se charge, réessaie');ask('Connexion',[{k:'e',l:'E-mail',t:'email'},{k:'p',l:'Mot de passe',t:'password'}],{},r=>fb.A.signInWithEmailAndPassword(fb.au,r.e,r.p).catch(()=>toast('Connexion refusée')),r=>fb.A.createUserWithEmailAndPassword(fb.au,r.e,r.p).catch(()=>toast('Création impossible')),'Créer un compte')},
 out:()=>fb.A.signOut(fb.au),
 cloud:()=>{const b=B();Object.assign(b,{cloud:true,mine:true,owner:user.uid,oe:em(),shared:{}});touch()},
 share:()=>ask('Inviter',[{k:'e',l:'E-mail de la personne',t:'email'},{k:'r',l:'Droits',t:'chips',o:[['edit','✏️ Peut modifier'],['view','👀 Lecture seule']]}],{r:'edit'},r=>{if(!r.e)return;const b=B();b.shared={...b.shared,[r.e.trim().toLowerCase()]:r.r};touch()}),
 unsh:v=>{const b=B();delete b.shared[v];touch()}};
const SAFE=['tab','ym','pick','exp','imp','cfg','login','out','scnUse','useTrip'];
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;if(!SAFE.includes(a)&&!can())return toast('Budget en lecture seule 👀');A[a]?.(t.dataset.v)});
document.addEventListener('input',e=>{const k=e.target.dataset.sim;if(!k)return;S.sim[k]=+e.target.value;save();const b=B();if($('#simres'))$('#simres').innerHTML=simOut(b,simR(b),S.sim);if($('#trip'))$('#trip').textContent=X(S.sim.goal/Math.max(1,S.sim.mois))});

/* firebase */
async function push(){if(!fb||!user)return;for(const b of S.bs)if(b.cloud&&can(b)&&b.up>(b.pushed||0)){const s=b.shared||{};
 try{await fb.F.setDoc(fb.F.doc(fb.db,'budgets',b.id),{owner:b.owner,emails:[b.oe,...Object.keys(s)],editors:[b.oe,...Object.keys(s).filter(k=>s[k]=='edit')],up:b.up,data:JSON.stringify({...b,pushed:0,mine:false})});b.pushed=b.up;localStorage.setItem('bp2',JSON.stringify(S))}catch(e){toast('Synchro impossible 😢')}}}
function listen(){un&&un();un=null;if(!fb||!user)return;
 un=fb.F.onSnapshot(fb.F.query(fb.F.collection(fb.db,'budgets'),fb.F.where('emails','array-contains',em())),s=>{
  s.docChanges().forEach(c=>{if(c.type=='removed')return;const d=c.doc.data(),r=JSON.parse(d.data);if(r.v!=2)return;const l=S.bs.find(b=>b.id==r.id);
   if(!l)S.bs.push({...r,cloud:true,pushed:r.up,mine:d.owner==user.uid});else if(r.up>l.up)Object.assign(l,r,{cloud:true,pushed:r.up,mine:l.mine})});
  localStorage.setItem('bp2',JSON.stringify(S));render();push()})}
async function fbInit(){if(!S.fb)return;try{const[a,au,fs]=await Promise.all(['app','auth','firestore'].map(x=>import(`https://www.gstatic.com/firebasejs/10.12.0/firebase-${x}.js`)));
 const app=a.initializeApp(S.fb);fb={au:au.getAuth(app),db:fs.getFirestore(app),A:au,F:fs};au.onAuthStateChanged(fb.au,u=>{user=u;listen();render()})}catch(e){toast('Firebase indisponible')}}
render();fbInit();
</script></body></html>
